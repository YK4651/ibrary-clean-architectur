version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: test-architecture-master-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: library
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  db_data: